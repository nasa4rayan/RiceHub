name: Theme Validation

on:
  pull_request:
    paths:
      - 'themes/**/manifest.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=scripts
      - name: Validate changed theme manifests
        run: |
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'manifest.yaml' | while read file; do
            echo "Validating $file"
            node scripts/dist/validate-theme.js "$file"
          done
